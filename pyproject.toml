[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot"
version = "0.1.0"
description = "Локальная диагностика табличных классификаторов"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "python-multipart==0.0.32",
    "numpy==2.4.3",
    "pyarrow==23.0.1",
    "onnx==1.21.0",
    "onnxruntime==1.24.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blindspot = ["web/*.html", "web/*.css", "web/*.js"]
