name: Проверка приложения
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - name: Проверить компоненты на тестовых комплектах
        run: |
          docker run --rm --network none -v "$PWD/tests:/app/tests:ro" -v "$PWD/examples:/app/examples:ro" blindspot-controller:0.1.0 python -m unittest discover -s tests/unit
          docker run --rm --network none -v "$PWD/tests:/app/tests:ro" -v "$PWD/examples:/app/examples:ro" blindspot-controller:0.1.0 python -m unittest discover -s tests/integration
      - run: python3 tests/e2e/check_http.py http://127.0.0.1:8765
      - run: docker run --rm -i --pull never --network none blindspot-controller:0.1.0 python - < tests/e2e/check_offline.py
      - name: Проверить загрузку, разбиение и границу F2
        run: |
          python3 tests/e2e/check_validation.py http://127.0.0.1:8765 examples/binary examples/multiclass
          python3 tests/e2e/check_versions.py http://127.0.0.1:8765 examples/binary --control-output /tmp/control.json
          python3 tests/e2e/check_isolation.py /tmp/control.json
      - name: Сверить прогнозы и измерения F1
        run: |
          python3 scripts/dispatch_jobs.py > /tmp/blindspot-dispatch.log 2>&1 &
          dispatcher=$!
          trap 'kill "$dispatcher" || true' EXIT
          docker run --rm --network container:blindspot-controller-1 -v "$PWD/tests:/app/tests:ro" -v "$PWD/examples:/app/examples:ro" blindspot-controller:0.1.0 python tests/e2e/check_baseline.py http://127.0.0.1:8000 examples/binary
      - name: Проверить контекст до и после базового опыта
        run: python3 tests/e2e/check_context.py http://127.0.0.1:8765 /tmp/control.json
      - if: always()
        run: docker compose down
